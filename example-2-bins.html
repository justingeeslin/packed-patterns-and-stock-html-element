<html>
	<head>
		<style>
			:root {
			--bg: #ffffff;
			--text: #111111;
			--border: #ccc;
			--shape-color: #0091EA;
			--shape-width: 2px;
			
			--shape-color-stock: black;
			}
			@media (prefers-color-scheme: dark) {
			  :root {
				--bg: black;
				--text: #e5e5e5;
				--border: #333333;
				--shape-width: 4px;
				
				--shape-color-stock: white;
			  }
			}
		
			body {
			  background-color: var(--bg);
			  color: var(--text);
			  /* background-color: black */
			}
			
		  .layout {
			display: grid;
			grid-template-columns: 300px 1fr;
			gap: 24px;
			align-items: start;
			max-width: 1200px;
			margin: 24px auto;
		  }
		
		  .palette {
			border: 1px solid var(--border);
			padding: 16px;
			border-radius: 8px;
			display: grid;
			gap: 12px;
		  }
		  
		  svg polygon, rect, path {
			  stroke: var(--shape-color);
			  stroke-width: var(--shape-width)
		  }
		  
		  polygon[role="stock"] {
			  stroke: var(--shape-color-stock)
		  }
		  
		</style>
	</head>
