<html>
	<head>
		<style>
			:root {
			--bg: #ffffff;
			--text: #111111;
			--border: #ccc;
			--shape-color: #0091EA;
			--shape-width: 2px;
			
			--shape-color-stock: black;
			}
			@media (prefers-color-scheme: dark) {
			  :root {
				--bg: black;
				--text: #e5e5e5;
				--border: #333333;
				--shape-width: 4px;
				
				--shape-color-stock: white;
			  }
			}
		
			body {
			  background-color: var(--bg);
			  color: var(--text);
			  /* background-color: black */
			}
			
		  .layout {
			display: grid;
			grid-template-columns: 300px 1fr;
			gap: 24px;
			align-items: start;
			max-width: 1200px;
			margin: 24px auto;
		  }
		
		  .palette {
			border: 1px solid var(--border);
			padding: 16px;
			border-radius: 8px;
			display: grid;
			gap: 12px;
		  }
		  
		  svg polygon, rect, path {
			  stroke: var(--shape-color);
			  stroke-width: var(--shape-width)
		  }
		  
		  polygon[role="stock"] {
			  stroke: var(--shape-color-stock)
		  }
		  
		</style>
	</head>
	<body>
	<div class="layout">
	  <uploadable-palette board="board"></uploadable-palette>

	  <pattern-pack-board
		  endpoint="/__packaide_irregular_stock"
		  tolerance="0.03"
		  offset="0"
		  rotations="1"
		  persist="false"
		  include-stock="true"
		  partial-solution="true"
	  >
		  <svg viewBox="0 0 1200 750" aria-label="Draggable garment parts" id="board" style="touch-action: none;">
		  
			<rect x="0" y="0" width="1200" height="750" fill="url(#grid)"></rect>
		  
			<!-- T-shirt -->
				<polygon id="full" points="561.00,90.00 441.00,29.00 350.00,0.00 327.00,15.00 286.00,21.00 235.00,17.00 202.00,2.00 123.00,30.00 0.00,95.00 60.00,202.00 110.00,191.00 111.00,570.00 458.00,566.00 455.00,186.00 505.00,199.00" fill="none" stroke="#0091EA" stroke-width="3" role="stock"></polygon>
				<polygon id="stock-scrap" points="650,90 735,90 735,145 710,145 710,200 650,200" fill="none" stroke="#00C853" stroke-width="3" role="stock"></polygon>
				<polygon id="starter-piece" data-draggable="true" role="garment" transform="translate(780 420)"
				  points="0.00,504.00 60.00,533.00 317.00,394.00 87.00,0.00"
				  fill="transparent"
				  pointer-events="all"
				  stroke="#0091EA"
				  stroke-width="3"></polygon>
			
		  
			  <!-- <polygon id="left-sleeve" viewBox="0.00 0.00 305.00 573.00" data-draggable="true" role="garment" transform="translate(720 130)"
				points="256.00,0.00 14.00,344.00 0.00,398.00 246.00,573.00 305.00,526.00"
				fill="transparent"
				pointer-events="all"
				stroke="#0091EA"
				stroke-width="3"/>
		  
			  <polygon data-draggable="true" role="garment" transform="translate(780 420)"
				points="0.00,504.00 60.00,533.00 317.00,394.00 87.00,0.00"
				fill="transparent"
				pointer-events="all"
				stroke="#0091EA"
				stroke-width="3"/> -->
		  <!-- <polygon id="untitled" points="40.00,0.00 39.00,1.00 2.00,1.00 1.00,2.00 1.00,20.00 0.00,21.00 0.00,38.00 1.00,39.00 1.00,47.00 0.00,48.00 0.00,83.00 1.00,84.00 1.00,88.00 2.00,88.00 3.00,89.00 52.00,89.00 53.00,88.00 57.00,88.00 57.00,87.00 58.00,86.00 58.00,58.00 57.00,57.00 57.00,24.00 58.00,23.00 58.00,8.00 57.00,7.00 57.00,2.00 56.00,1.00 48.00,1.00 47.00,0.00" fill="none" stroke="#00C853" stroke-width="2" role="stock"></polygon></svg> -->
	  </pattern-pack-board>
	</div>

	<script type="module">
	  import "./src/UploadablePalette.js";
	  import "./src/PatternPackBoard.js";

	  const palette = document.querySelector("uploadable-palette");
	  palette.addEventListener("svg-uploaded", (event) => {
		console.log("Uploaded SVG added as", event.detail.controlId);
	  });

	  const endpoint = new URLSearchParams(window.location.search).get("endpoint");
	  const packBoard = document.querySelector("pattern-pack-board");

	  if (endpoint) {
		packBoard.endpoint = endpoint;
	  }

	  packBoard.addEventListener("sync-error", (event) => {
		console.error("SVG sync failed", event.detail.error);
	  });
	  
	  
	</script>
  </body>
</html>
