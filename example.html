<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PatternPackBoard Basic Example</title>
  </head>
  <body>
    <pattern-pack-board
      endpoint="/__packaide_irregular_stock"
      tolerance="0.03"
      offset="0"
      rotations="1"
      persist="false"
      include-stock="true"
    >
      <svg
        id="board"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 520 320"
        width="520"
        height="320"
        aria-label="Garment pieces and stock"
      >
        <polygon
          id="stock-1"
          role="stock"
          points="20,20 480,20 500,180 420,300 60,280 0,120"
          fill="none"
          stroke="#222"
          stroke-width="3"
        ></polygon>

        <path
          id="front-bodice"
          role="garment"
          data-draggable="true"
          d="M 180 90 L 310 90 L 345 230 L 145 230 Z"
          fill="transparent"
          stroke="#0077cc"
          stroke-width="3"
          pointer-events="all"
        ></path>
      </svg>
    </pattern-pack-board>

    <script type="module">
      import "./src/PatternPackBoard.js";

      const endpoint = new URLSearchParams(window.location.search).get("endpoint");
      const board = document.querySelector("pattern-pack-board");

      if (endpoint) {
        board.endpoint = endpoint;
      }

      board.addEventListener("sync-error", (event) => {
        console.error("SVG sync failed", event.detail.error);
      });
    </script>
  </body>
</html>
